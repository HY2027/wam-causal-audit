[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-causal-audit"
version = "0.1.0"
description = "Source-conditioned action-interface audits and reproducibility materials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
